    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.cloudSync = {
      enabled: false,
      status: "OFFLINE",
      lastUpdatedBy: "",
      init: async function () {
        try {
          if (typeof __firebase_config === "undefined" || !__firebase_config) return;
          const firebaseConfig = JSON.parse(__firebase_config);
          const appId = typeof __app_id !== "undefined" ? __app_id : "erapor-pkbm-arm";
          const fbApp = initializeApp(firebaseConfig);
          const auth = getAuth(fbApp);
          const db = getFirestore(fbApp);

          if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          const user = auth.currentUser;
          if (!user) return;

          const stateDocRef = doc(db, "artifacts", appId, "public", "data", "erapor_live_state", "main");
          this.enabled = true;
          this.status = "LIVE";

          this.push = async function (payloadObj, actorName) {
            if (!auth.currentUser) return;
            try {
              await setDoc(stateDocRef, {
                payloadJson: JSON.stringify(payloadObj),
                updatedAt: Date.now(),
                updatedBy: actorName || "Pengguna",
              });
            } catch (err) {
              console.error("Cloud sync write error:", err);
            }
          };

          onSnapshot(
            stateDocRef,
            (snap) => {
              if (!snap.exists()) {
                if (typeof window.getAppDataSnapshot === "function") {
                  this.push(window.getAppDataSnapshot(), "Sistem Awal");
                }
                return;
              }
              const data = snap.data();
              if (data && data.payloadJson && typeof window.applyRemoteAppState === "function") {
                window.applyRemoteAppState(data.payloadJson, data.updatedAt, data.updatedBy);
              }
            },
            (err) => {
              console.error("Cloud sync snapshot error:", err);
              this.status = "LOCAL";
              if (typeof window.renderApp === "function") window.renderApp();
            }
          );

          if (typeof window.renderApp === "function") window.renderApp();
        } catch (e) {
          console.warn("Running in local live-sync mode:", e);
        }
      },
    };

    window.addEventListener("DOMContentLoaded", () => {
      window.cloudSync.init();
    });
  </script>

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function hitungPredikatK13(nilai, kkm) {
      const n = Number(nilai) || 0;
      const k = Number(kkm) || 75;
      const interval = (100 - k) / 3;
      const batasB = Math.round(k + interval);
      const batasA = Math.round(k + 2 * interval);
      if (n >= batasA) return "A";
      if (n >= batasB) return "B";
      if (n >= k) return "C";
      return "D";
    }

    function getIntervalInfoK13(kkm) {
      const k = Number(kkm) || 75;
      const interval = Math.round((100 - k) / 3);
      return {
        D: `< ${k}`,
        C: `${k} - ${k + interval - 1}`,
        B: `${k + interval} - ${k + 2 * interval - 1}`,
        A: `${k + 2 * interval} - 100`,
      };
    }

    function generateDeskripsiMerdeka(daftarTp) {
      if (!daftarTp || daftarTp.length === 0) return "";
      const sorted = [...daftarTp].sort((a, b) => Number(b.skor) - Number(a.skor));
      const tertinggi = sorted[0];
      const terendah = sorted[sorted.length - 1];

      const cleanTinggi = (tertinggi.deskripsi || "").replace(/\.$/, "");
      const cleanRendah = (terendah.deskripsi || "").replace(/\.$/, "");

      const kalimatTinggi = `Mencapai Kompetensi dengan sangat baik dalam hal ${
        cleanTinggi.charAt(0).toLowerCase() + cleanTinggi.slice(1)
      }.`;

      if (sorted.length === 1 || cleanTinggi === cleanRendah) {
        return kalimatTinggi;
      }

      const kalimatRendah = `Perlu peningkatan dalam hal ${
        cleanRendah.charAt(0).toLowerCase() + cleanRendah.slice(1)
      }.`;

      return `${kalimatTinggi} ${kalimatRendah}`;
    }

    function generateDeskripsiK13(daftarKd, kkm) {
      if (!daftarKd || daftarKd.length === 0) return "";
      const sorted = [...daftarKd].sort((a, b) => Number(b.skor) - Number(a.skor));
      const tertinggi = sorted[0];
      const terendah = sorted[sorted.length - 1];

      const predikat = hitungPredikatK13(tertinggi.skor, kkm);
      const kualitas = predikat === "A" ? "sangat baik" : predikat === "B" ? "baik" : "cukup baik";
      const cleanTinggi = (tertinggi.deskripsi || "").replace(/\.$/, "");
      const cleanRendah = (terendah.deskripsi || "").replace(/\.$/, "");

      const kalimat1 = `Memiliki kemampuan ${kualitas} dalam hal ${
        cleanTinggi.charAt(0).toLowerCase() + cleanTinggi.slice(1)
      }.`;

      if (sorted.length === 1 || cleanTinggi === cleanRendah) {
        return kalimat1;
      }

      const kalimat2 =
        Number(terendah.skor) < Number(kkm)
          ? `Perlu bimbingan dalam hal ${cleanRendah.charAt(0).toLowerCase() + cleanRendah.slice(1)}.`
          : `Perlu peningkatan dalam hal ${cleanRendah.charAt(0).toLowerCase() + cleanRendah.slice(1)}.`;

      return `${kalimat1} ${kalimat2}`;
    }

    function buildInitialNilaiMap(siswas, mapels) {
      const initial = {};
      siswas.forEach((s, sIdx) => {
        initial[s.id] = {};
        mapels.forEach((m, mIdx) => {
          const baseScore = Math.min(96, 78 + ((sIdx * 3 + mIdx * 4) % 18));
          const secondScore = Math.max(75, baseScore - 7);
          const tpScores = {};
          const tpList = m.tps.map((tp, tIdx) => {
            const sc = tIdx === 0 ? baseScore : secondScore;
            tpScores[tp.id] = sc;
            return { deskripsi: tp.deskripsi, skor: sc };
          });

          const nPeng = baseScore;
          const nKet = Math.min(98, baseScore + 2);
          const kdPengList = m.kds
            .filter((k) => k.aspek === "PENGETAHUAN")
            .map((k) => ({ deskripsi: k.deskripsi, skor: nPeng }));
          const kdKetList = m.kds
            .filter((k) => k.aspek === "KETERAMPILAN")
            .map((k) => ({ deskripsi: k.deskripsi, skor: nKet }));

          initial[s.id][m.id] = {
            tpScores,
            nilaiAkhirMerdeka: Math.round((baseScore + secondScore) / 2),
            deskripsiMerdeka: generateDeskripsiMerdeka(tpList),
            nilaiPengetahuan: nPeng,
            predikatPengetahuan: hitungPredikatK13(nPeng, m.kkm),
            deskripsiPengetahuan: generateDeskripsiK13(kdPengList, m.kkm),
            nilaiKeterampilan: nKet,
            predikatKeterampilan: hitungPredikatK13(nKet, m.kkm),
            deskripsiKeterampilan: generateDeskripsiK13(kdKetList, m.kkm),
          };
        });
      });
      return initial;
    }

    function buildInitialMapping(rombels, mapels) {
      const mapping = {};
      rombels.forEach((r) => {
        mapping[`${r.program}::${r.faseTingkatan}`] = mapels.map((m) => m.id);
      });
      return mapping;
    }

    function loadAppState() {
      const cloned = JSON.parse(JSON.stringify(DEFAULT_STATE));
      cloned.nilaiMap = buildInitialNilaiMap(cloned.siswas, cloned.mapels);
      cloned.tingkatanMapelMapping = buildInitialMapping(cloned.rombels, cloned.mapels);
      return cloned;
    }

    window.applyRemoteAppState = function (payloadJson, updatedAt, updatedBy) {
      if (updatedAt && updatedAt <= lastSyncedTimestamp) return;
      try {
        const parsed = JSON.parse(payloadJson);
        if (parsed && parsed.profil && Array.isArray(parsed.siswas)) {
          isApplyingRemoteUpdate = true;
          appData = parsed;
          lastSyncedTimestamp = updatedAt || Date.now();
          updateDynamicPrintStyle();

          // Pertahankan fokus input jika user sedang mengetik di textarea/input
          const activeEl = document.activeElement;
          const isTyping =
            activeEl &&
            (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA") &&
            activeEl.type !== "checkbox";
          if (!isTyping) {
            renderApp();
          }
          isApplyingRemoteUpdate = false;
        }
      } catch (e) {
        isApplyingRemoteUpdate = false;
      }
    };

    function saveAppState(silent = true) {
      if (isApplyingRemoteUpdate) return;
      lastSyncedTimestamp = Date.now();
      if (window.cloudSync && window.cloudSync.enabled && typeof window.cloudSync.push === "function") {
        window.cloudSync.push(appData, currentUser?.nama || "Pengguna");
      }
      if (!silent) {
        showToast("Perubahan tersimpan secara live!");
      }
    }

      }

      box.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add("hidden"), 3500);
    }

    function openPasswordModal() {

      document.getElementById("password-modal").classList.add("hidden");

    function handleSaveMyPassword(e) {
      e.preventDefault();
      const errBox = document.getElementById("pass-modal-error");
      const oldP = document.getElementById("old-my-pass").value;
      const newP = document.getElementById("new-my-pass").value;
      const confP = document.getElementById("confirm-my-pass").value;

      if (newP.length < 4) {
        errBox.textContent = "Kata sandi baru minimal 4 karakter.";
        errBox.classList.remove("hidden");
        return;
      }
      if (newP !== confP) {
        errBox.textContent = "Konfirmasi kata sandi baru tidak cocok.";
        errBox.classList.remove("hidden");
        return;
      }

      if (currentUser.role === "WARGA_BELAJAR") {
        const st = appData.siswas.find((s) => s.id === currentUser.id);
        if (st && st.password !== oldP) {
          errBox.textContent = "Kata sandi lama tidak sesuai.";
          errBox.classList.remove("hidden");
          return;
        }
        st.password = newP;
      } else {
        const usr = appData.users.find((u) => u.id === currentUser.id);
        if (usr && usr.password !== oldP) {
          errBox.textContent = "Kata sandi lama tidak sesuai.";
          errBox.classList.remove("hidden");
          return;
        }
        usr.password = newP;
      }

      saveAppState();
      closePasswordModal();
      showToast("Kata sandi akun Anda berhasil diperbarui!");
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;
      const errDiv = document.getElementById("login-error");

      const foundStaff = appData.users.find(
        (u) => u.username.toLowerCase() === username.toLowerCase() && u.password === password
      );
      if (foundStaff) {
        currentUser = foundStaff;
        activeTab = "dashboard";
        renderApp();
        showToast(`Selamat datang, ${foundStaff.nama}!`);
        return;
      }

      const foundStudent = appData.siswas.find(
        (s) =>
          s.isActive !== false &&
          (s.nis === username || (s.nisn && s.nisn === username)) &&
          s.password === password
      );
      if (foundStudent) {
        currentUser = {
          id: foundStudent.id,
          username: foundStudent.nis,
          nama: foundStudent.nama,
          role: "WARGA_BELAJAR",
        };
        cetakSiswaId = foundStudent.id;
        activeTab = "rapor";
        renderApp();
        showToast(`Selamat datang, ${foundStudent.nama}!`);
        return;
      }

      errDiv.textContent = "Username / NISN atau kata sandi tidak sesuai. Silakan periksa kembali.";
      errDiv.classList.remove("hidden");
    }

      currentUser = null;

      const defaults = [

        { key: "Paket A::Fase B", program: "Paket A", faseTingkatan: "Fase B", kurikulum: "MERDEKA", label: "Paket A — Fase B (Kelas 3-4 Merdeka)" },
        { key: "Paket A::Fase C", program: "Paket A", faseTingkatan: "Fase C", kurikulum: "MERDEKA", label: "Paket A — Fase C (Kelas 5-6 Merdeka)" },
        { key: "Paket A::Tingkatan 1", program: "Paket A", faseTingkatan: "Tingkatan 1", kurikulum: "K13", label: "Paket A — Tingkatan 1 (Kelas 1-3 K-13)" },
        { key: "Paket A::Tingkatan 2", program: "Paket A", faseTingkatan: "Tingkatan 2", kurikulum: "K13", label: "Paket A — Tingkatan 2 (Kelas 4-6 K-13)" },
        { key: "Paket B::Fase D", program: "Paket B", faseTingkatan: "Fase D", kurikulum: "MERDEKA", label: "Paket B — Fase D (Kelas 7-9 Merdeka)" },
        { key: "Paket B::Tingkatan 3", program: "Paket B", faseTingkatan: "Tingkatan 3", kurikulum: "K13", label: "Paket B — Tingkatan 3 (Kelas 7-8 K-13)" },
        { key: "Paket B::Tingkatan 4", program: "Paket B", faseTingkatan: "Tingkatan 4", kurikulum: "K13", label: "Paket B — Tingkatan 4 (Kelas 9 K-13)" },
        { key: "Paket C::Fase E", program: "Paket C", faseTingkatan: "Fase E", kurikulum: "MERDEKA", label: "Paket C — Fase E (Kelas 10 Merdeka)" },
        { key: "Paket C::Fase F", program: "Paket C", faseTingkatan: "Fase F", kurikulum: "MERDEKA", label: "Paket C — Fase F (Kelas 11-12 Merdeka)" },
        { key: "Paket C::Tingkatan 5", program: "Paket C", faseTingkatan: "Tingkatan 5", kurikulum: "K13", label: "Paket C — Tingkatan 5 (Kelas 10-11 K-13)" },
        { key: "Paket C::Tingkatan 6", program: "Paket C", faseTingkatan: "Tingkatan 6", kurikulum: "K13", label: "Paket C — Tingkatan 6 (Kelas 12 K-13)" },
      ];
      const mapByKey = new Map(defaults.map((d) => [d.key, d]));
      appData.rombels.forEach((r) => {
        const k = `${r.program}::${r.faseTingkatan}`;
        if (!mapByKey.has(k)) {
          mapByKey.set(k, { key: k, program: r.program, faseTingkatan: r.faseTingkatan, kurikulum: r.kurikulum, label: `${r.program} — ${r.faseTingkatan} (${r.kurikulum})` });
        }
      });
      return Array.from(mapByKey.values());
    }

    function navigateTab(tab, subTab) {
      activeTab = tab;
      if (subTab) masterSubTab = subTab;
      renderApp();
    }

    function handleLogoUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        appData.profil.logoPkbmBase64 = reader.result;
        saveAppState();
        renderApp();
        showToast("Logo satuan pendidikan berhasil diunggah!");
      };
      reader.readAsDataURL(file);
    }

    function saveProfilLembaga() {
      appData.profil.namaSatuan = document.getElementById("prof-nama").value;
      appData.profil.npsn = document.getElementById("prof-npsn").value;
      appData.profil.alamat = document.getElementById("prof-alamat").value;
      appData.profil.kecamatan = document.getElementById("prof-kec").value;
      appData.profil.namaKepala = document.getElementById("prof-kepala").value;
      appData.profil.nipKepala = document.getElementById("prof-nip").value;
      appData.profil.tahunPelajaran = document.getElementById("prof-tp").value;
      appData.profil.semester = document.getElementById("prof-sem").value;
      appData.profil.tanggalRapor = document.getElementById("prof-tgl").value;
      saveAppState();
      renderApp();
      showToast("Profil Lembaga & Pengaturan Rapor berhasil disimpan!");
    }

    function handleAddRombel(e) {
      e.preventDefault();
      const nama = document.getElementById("rb-nama").value.trim();
      const program = document.getElementById("rb-prog").value;
      const kurikulum = document.getElementById("rb-kur").value;
      const tingkatKelas = Number(document.getElementById("rb-kls").value);
      const faseTingkatan = document.getElementById("rb-fase").value.trim();
      const waliKelasId = document.getElementById("rb-wali").value;
      if (!nama) return;
      appData.rombels.push({
        id: `r_${Date.now()}`,
        namaRombel: nama,
        program,
        kurikulum,
        tingkatKelas,
        faseTingkatan,
        peminatan: "-",
        waliKelasId,
      });
      const tKey = `${program}::${faseTingkatan}`;
      if (!appData.tingkatanMapelMapping[tKey]) {
        appData.tingkatanMapelMapping[tKey] = appData.mapels.filter((m) => m.isActive !== false).map((m) => m.id);
      }
      saveAppState();
      renderApp();
      showToast("Rombel baru berhasil ditambahkan!");
    }

    function changeRombelKurikulum(id, val) {
      const rb = appData.rombels.find((r) => r.id === id);
      if (rb) {
        rb.kurikulum = val;
        saveAppState();
        renderApp();
        showToast(`Kurikulum ${rb.namaRombel} diubah ke ${val}`);
      }
    }

    function deleteRombel(id) {
      if (appData.rombels.length <= 1) {
        showToast("Minimal harus menyisakan 1 Rombel aktif.");
        return;
      }
      const rb = appData.rombels.find((r) => r.id === id);
      appData.rombels = appData.rombels.filter((r) => r.id !== id);
      saveAppState();
      renderApp();
      showToast(`Rombel "${rb?.namaRombel}" berhasil dihapus.`);
    }

    function handleAddMapel(e) {
      e.preventDefault();
      const nama = document.getElementById("mp-nama").value.trim();
      const kelompok = document.getElementById("mp-kel").value;
      const skk = Number(document.getElementById("mp-skk").value);
      const kkm = Number(document.getElementById("mp-kkm").value);
      if (!nama) return;
      const newId = `m_${Date.now()}`;
      appData.mapels.push({
        id: newId,
        kode: nama.slice(0, 4).toUpperCase(),
        nama,
        kelompok,
        skk,
        kkm,
        tutorId: appData.users[1]?.id || "t1",
        isActive: true,
        tps: [
          { id: `tp_${Date.now()}_1`, kode: "TP.1", deskripsi: `Memahami konsep esensial dan ruang lingkup ${nama}`, isActive: true },

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(String(ev.target?.result || "{}"));
          const d = parsed.data || parsed;
          if (!d.profil || !Array.isArray(d.siswas) || !Array.isArray(d.rombels)) {
            showToast("Format file backup tidak valid!");
            return;
          }
          appData = d;
          updateDynamicPrintStyle();
          saveAppState();
          renderApp();
          showToast(`Restore berhasil! (${d.siswas.length} Warga Belajar dipulihkan)`);
        } catch (err) {
          showToast("Gagal membaca file backup JSON.");
        }
      };
      reader.readAsText(file);
    }

    function handleGenerateNilaiOtomatisAll() {
      const rb = appData.rombels.find((r) => r.id === penilaianRombelId) || appData.rombels[0];
      const mp = appData.mapels.find((m) => m.id === penilaianMapelId) || appData.mapels[0];
      const activeTps = mp.tps.filter((t) => t.isActive !== false);
      const members = appData.siswas.filter((s) => s.rombelId === rb.id && s.isActive !== false);

      members.forEach((s, idx) => {
        if (!appData.nilaiMap[s.id]) appData.nilaiMap[s.id] = {};
        const cur = appData.nilaiMap[s.id][mp.id] || {};
        const base = Math.min(96, Math.max(mp.kkm + 3, 78 + ((idx * 4 + s.nama.length) % 16)));
        const second = Math.max(mp.kkm, base - 6);

        if (rb.kurikulum === "MERDEKA") {
          const tpScores = { ...(cur.tpScores || {}) };
          const tpList = activeTps.map((tp, tIdx) => {
            const sc = tIdx % 2 === 0 ? base : second;
            tpScores[tp.id] = sc;
            return { deskripsi: tp.deskripsi, skor: sc };
          });
          const avg = Math.round(tpList.reduce((a, b) => a + b.skor, 0) / (tpList.length || 1));
          appData.nilaiMap[s.id][mp.id] = { ...cur, tpScores, nilaiAkhirMerdeka: avg, deskripsiMerdeka: generateDeskripsiMerdeka(tpList) };
        } else {
          const nP = base;
          const nK = Math.min(98, base + 2);
          const kdP = mp.kds.filter((k) => k.aspek === "PENGETAHUAN").map((k, ki) => ({ deskripsi: k.deskripsi, skor: ki === 0 ? nP : second }));
          const kdK = mp.kds.filter((k) => k.aspek === "KETERAMPILAN").map((k) => ({ deskripsi: k.deskripsi, skor: nK }));
          appData.nilaiMap[s.id][mp.id] = {
            ...cur,
            nilaiPengetahuan: nP,
            predikatPengetahuan: hitungPredikatK13(nP, mp.kkm),
            deskripsiPengetahuan: generateDeskripsiK13(kdP, mp.kkm),
            nilaiKeterampilan: nK,
            predikatKeterampilan: hitungPredikatK13(nK, mp.kkm),
            deskripsiKeterampilan: generateDeskripsiK13(kdK, mp.kkm),
          };
        }
      });
      saveAppState();
      renderApp();
      showToast(`Nilai & Deskripsi Capaian otomatis berhasil digenerate untuk ${members.length} Warga Belajar!`);
    }

      } else {
        rec.nilaiKeterampilan = num;

      if (!s) return;
      s.sikapSpiritual.deskripsi = generateAISikap("SPIRITUAL", s.sikapSpiritual.predikat, tingkatKelas);
      s.sikapSosial.deskripsi = generateAISikap("SOSIAL", s.sikapSosial.predikat, tingkatKelas);
      saveAppState();
      renderApp();
      showToast(`Deskripsi Sikap AI untuk ${s.nama} berhasil diisi!`);
    }

    function autoGenerateCatatanWali(siswaId, rombelId) {
      const s = appData.siswas.find((item) => item.id === siswaId);
      const rb = appData.rombels.find((r) => r.id === rombelId);
      if (!s || !rb) return;
      s.catatanWali = generateAICatatanWali(s, rb);
      saveAppState();
      renderApp();
      showToast(`Catatan Wali Kelas AI untuk ${s.nama} berhasil dibuat!`);
    }

    // =========================================================================
    // 12. RENDER UTAMA SHELL APLIKASI
    // =========================================================================

    function renderApp() {
      const root = document.getElementById("app");
      updateDynamicPrintStyle();

      if (!currentUser) {
        root.innerHTML = renderLoginView();
        refreshIcons();
        return;
      }

      const role = currentUser.role;
      const p = appData.profil;
      const navItems = [
        { id: "dashboard", label: "Dashboard Utama", icon: "layout-dashboard", roles: ["ADMIN", "TUTOR", "WALI_KELAS", "WARGA_BELAJAR"] },
        { id: "master", label: "Data Master & Pengaturan", icon: "database", roles: ["ADMIN"] },
        { id: "penilaian", label: "Input Nilai & TP / KD", icon: "pen-tool", roles: ["ADMIN", "TUTOR"] },
        { id: "p5_sikap", label: "Penilaian P5 & Sikap", icon: "award", roles: ["ADMIN", "TUTOR", "WALI_KELAS"] },
        { id: "wali_kelas", label: "Modul Wali / Pamong", icon: "user-check", roles: ["ADMIN", "WALI_KELAS"] },
        { id: "rapor", label: "Cetak & Preview Rapor", icon: "printer", roles: ["ADMIN", "TUTOR", "WALI_KELAS", "WARGA_BELAJAR"] },
      ].filter((item) => item.roles.includes(role));

      const roleLabel =
        role === "ADMIN"
          ? "Administrator / Operator PKBM"
          : role === "TUTOR"
          ? "Tutor (Pendidik)"
          : role === "WALI_KELAS"
          ? "Wali Kelas / Pamong Belajar"
          : "Warga Belajar (Peserta Didik)";

      let workspaceHtml = "";
      if (activeTab === "dashboard") workspaceHtml = renderDashboardModule();
      else if (activeTab === "master") workspaceHtml = renderMasterDataModule();
      else if (activeTab === "penilaian") workspaceHtml = renderPenilaianTutorModule();
      else if (activeTab === "p5_sikap") workspaceHtml = renderPenilaianP5SikapModule();
      else if (activeTab === "wali_kelas") workspaceHtml = renderWaliKelasModule();
      else if (activeTab === "rapor") workspaceHtml = renderCetakRaporModule();

      root.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans text-slate-800">
          <!-- SIDEBAR -->
          <aside class="no-print w-full md:w-64 bg-[#0F2C59] text-white flex flex-col justify-between shrink-0 shadow-xl">
            <div>
              <div class="p-5 border-b border-blue-800/80 flex items-center gap-3">
                ${
                  p.logoPkbmBase64
                    ? `<img src="${p.logoPkbmBase64}" alt="Logo" class="w-10 h-10 rounded-lg object-cover bg-white p-0.5 shrink-0" />`
                    : `<div class="w-10 h-10 rounded-lg bg-amber-400 text-[#0F2C59] flex items-center justify-center font-bold shrink-0"><i data-lucide="book-open" class="w-6 h-6"></i></div>`
                }
                <div class="overflow-hidden">
                  <p class="text-[10px] uppercase tracking-wider text-amber-300 font-bold">e-Rapor Kesetaraan</p>
                  <h1 class="text-xs font-extrabold truncate">${escapeHtml(p.namaSatuan)}</h1>
                </div>
              </div>
              <div class="p-3 mx-3 mt-3 bg-blue-950/70 rounded-xl border border-blue-800/70">
                <span class="text-[10px] uppercase tracking-wider text-blue-300 font-semibold block">Hak Akses Aktif:</span>
                <p class="text-xs font-extrabold text-amber-300 mt-0.5">${roleLabel}</p>
              </div>
              <nav class="p-3 space-y-1 mt-2">
                ${navItems
                  .map(
                    (item) => `
                  <button onclick="navigateTab('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
                      activeTab === item.id ? "bg-amber-400 text-[#0F2C59] shadow-md" : "text-blue-100 hover:bg-blue-900/60"
                    }">
                    <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                    <span>${item.label}</span>
                  </button>
                `
                  )
                  .join("")}
              </nav>
            </div>
            <div class="p-3 border-t border-blue-900 bg-[#0A1F40] space-y-2">
              <div class="px-2 py-1">
                <p class="text-[11px] font-bold text-white truncate">${escapeHtml(currentUser.nama)}</p>
                <p class="text-[10px] text-blue-300">Username: ${escapeHtml(currentUser.username)}</p>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
                <button type="button" onclick="openPasswordModal()" class="flex items-center justify-center gap-1 py-2 px-2 rounded-lg bg-blue-500/20 hover:bg-blue-500/30 text-blue-200 border border-blue-400/20 transition text-[11px] font-semibold"><i data-lucide="key-round" class="w-3.5 h-3.5"></i> Password</button>
                <button type="button" onclick="handleLogout()" class="flex items-center justify-center gap-1 py-2 px-2 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-200 border border-red-400/20 transition text-[11px] font-semibold"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar</button>
              </div>
            </div>
          </aside>

          <!-- MAIN WORKSPACE -->
          <main class="flex-1 flex flex-col min-w-0">
            <header class="no-print bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap justify-between items-center gap-3 sticky top-0 z-10 shadow-sm">
              <div class="flex items-center gap-2.5 text-xs font-bold text-slate-600">
                <span>${escapeHtml(p.namaSatuan)} • TP ${escapeHtml(p.tahunPelajaran)}</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ${window.cloudSync?.enabled ? "Live Cloud Sync" : "Live Auto-Sync"}
                </span>
              </div>
              <div class="flex items-center gap-2.5">
                <div class="text-right hidden sm:block mr-1">
                  <p class="text-xs font-bold text-slate-800">${escapeHtml(currentUser.nama)}</p>
                  <p class="text-[11px] text-emerald-600 font-medium">● Sesi Aktif (${role})</p>
                </div>
                <button onclick="openPasswordModal()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 flex items-center gap-1.5 transition"><i data-lucide="key-round" class="w-3.5 h-3.5 text-blue-600"></i> Ganti Password</button>
                <button onclick="handleLogout()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-red-600 hover:bg-red-700 text-white flex items-center gap-1.5 shadow-sm transition"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout</button>
              </div>
            </header>
            <div class="p-4 md:p-6 flex-1 max-w-7xl w-full mx-auto">
              ${workspaceHtml}
            </div>
          </main>
        </div>
      `;

      refreshIcons();
    }

    window.addEventListener("DOMContentLoaded", function () {
      renderApp();
    });
  </script>
</body>
</html>
